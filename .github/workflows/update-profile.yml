name: Update GitHub Profile

on:
  # Profile README/workflow change hone par
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/update-profile.yml"

  # Har hour profile statistics refresh
  schedule:
    - cron: "0 * * * *"

  # Actions tab se manually run karne ke liye
  workflow_dispatch:

# GitHub Actions ko generated files commit/push karne ki permission
permissions:
  contents: write

# Ek hi time par do workflow runs nahi chalenge
concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:

  # ============================================================
  # 1. GENERATE PROFILE CARDS + UPDATE PROJECTS + TROPHIES
  # ============================================================

  update-profile:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # 2. GENERATE REAL GITHUB PROFILE CARDS
      # ----------------------------------------------------------

      - name: Generate GitHub Profile Cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: CoderAzharAnsari62

          # All useful profile cards
          cards: overview,lifetime,contributions,composition,rhythm,languages

          # Generated SVG files
          output-dir: assets

          # GitHub light + dark mode
          themes: light,dark

          # Hum end me ek hi commit karenge
          commit: false

      # ----------------------------------------------------------
      # 3. UPDATE LATEST GITHUB PROJECTS
      # ----------------------------------------------------------

      - name: Update Latest GitHub Projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          python3 <<'PY'

          import json
          import os
          import urllib.request
          from pathlib import Path

          username = "CoderAzharAnsari62"
          readme = Path("README.md")

          # GitHub API URL
          url = (
              f"https://api.github.com/users/{username}/repos"
              "?per_page=100&sort=updated"
          )

          # GitHub API headers
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
          )

          # Fetch repositories
          try:
              with urllib.request.urlopen(request) as response:
                  repos = json.load(response)
          except Exception as error:
              print(f"Could not fetch repositories: {error}")
              raise

          # ------------------------------------------------------
          # Remove:
          # - Forked repositories
          # - Profile repository itself
          # ------------------------------------------------------

          repos = [
              repo
              for repo in repos
              if not repo.get("fork", False)
              and repo.get("name") != username
          ]

          # Latest 6 projects
          repos = repos[:6]

          # ------------------------------------------------------
          # Build project section
          # ------------------------------------------------------

          section = ""

          if repos:
              for repo in repos:

                  name = repo.get("name", "Untitled Project")

                  description = (
                      repo.get("description")
                      or "No description available."
                  )

                  html_url = repo.get(
                      "html_url",
                      f"https://github.com/{username}/{name}"
                  )

                  section += f"### [{name}]({html_url})\n\n"
                  section += f"{description}\n\n"
          else:
              section = "No public projects available yet.\n"

          # ------------------------------------------------------
          # Automatic project markers
          # ------------------------------------------------------

          start = "<!-- AUTO-PROJECTS-START -->"
          end = "<!-- AUTO-PROJECTS-END -->"

          content = readme.read_text(encoding="utf-8")

          new_block = (
              f"{start}\n"
              f"{section}"
              f"{end}"
          )

          # Replace existing automatic project block
          if start in content and end in content:

              before = content.split(start, 1)[0]
              after = content.split(end, 1)[1]

              content = (
                  before
                  + new_block
                  + after
              )

          # If markers don't exist, append them
          else:

              content = (
                  content.rstrip()
                  + "\n\n"
                  + new_block
                  + "\n"
              )

          readme.write_text(
              content,
              encoding="utf-8"
          )

          print("Latest GitHub Projects updated successfully.")

          PY

      # ----------------------------------------------------------
      # 4. GENERATE REAL GITHUB TROPHIES
      # ----------------------------------------------------------

      - name: Generate GitHub Trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: >-
            username=CoderAzharAnsari62&theme=onedark&column=7&row=2&margin-w=15&margin-h=15
          path: assets/github-trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # 5. CHECK GENERATED FILES
      # ----------------------------------------------------------

      - name: Check generated profile assets
        run: |
          echo "======================================"
          echo "Generated Profile Assets"
          echo "======================================"

          if [ -d "assets" ]; then
            find assets -maxdepth 2 -type f -print
          else
            echo "ERROR: assets directory not found."
            exit 1
          fi

      # ----------------------------------------------------------
      # 6. COMMIT EVERYTHING TOGETHER
      # ----------------------------------------------------------

      - name: Commit README and Profile Cards
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Add README
          git add README.md

          # Add generated profile cards
          git add assets/

          # Check whether anything changed
          if git diff --cached --quiet; then

            echo "No changes to commit."
            exit 0

          fi

          # Commit
          git commit \
            -m "chore: automatically update GitHub profile"

          # Push
          git push
